# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml
 
stages:
  - smoke
  - unit
  - integration
  - functional
  - e2e
  - acceptance
 

default:
  image: python:3.10
  before_script:
    - pip install -r requirements.txt

# SMOKE TESTING
smoke:
  stage: smoke
  script:
    - echo "🚀 Running smoke tests..."
    - python -c "import pandas; import sklearn; print('✅ Python packages imported successfully')"
  only:
    - merge_requests
    - branches

# UNIT TESTS
unit_tests:
  stage: unit
  script:
    - echo "🔬 Running unit tests..."
    - pytest tests/ --tb=short --disable-warnings -m "not integration and not functional"
  only:
    - merge_requests
    - branches

# INTEGRATION TESTS
integration_tests:
  stage: integration
  script:
    - echo "🔗 Running integration tests..."
    - pytest tests/ --tb=short -m "integration"
  only:
    - merge_requests
    - branches

# FUNCTIONAL TESTS
functional_tests:
  stage: functional
  script:
    - echo "🎯 Running functional tests..."
    - pytest tests/ --tb=short -m "functional"
  only:
    - merge_requests
    - branches

# END-TO-END TESTS
e2e_tests:
  stage: e2e
  script:
    - echo "🧪 Running end-to-end tests..."
    - echo "(Placeholder for selenium or cypress or streamlit smoke test)"
  only:
    - merge_requests
    - branches

# ACCEPTANCE TESTS
acceptance_tests:
  stage: acceptance
  script:
    - echo "✅ Acceptance criteria checks (to be implemented)..."
    - echo "(Placeholder for user-acceptance scripts or test plans)"
  only:
    - merge_requests
    - branches

